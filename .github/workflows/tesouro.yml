name: Atualizar Tesouro

# Baixa as taxas oficiais do Tesouro Direto e grava data/tesouro.json, que o site usa.
on:
  schedule:
    - cron: "17 22 * * 1-5" # dias úteis, 19h17 em Brasília (22h17 UTC)
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: write

concurrency:
  group: atualizar-tesouro
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Testar o leitor do CSV
        run: node tests/tesouro.test.mjs

      - name: Baixar as taxas do Tesouro
        run: node scripts/atualizar-tesouro.mjs

      - name: Salvar se mudou
        run: |
          if git ls-files --error-unmatch data/tesouro.json >/dev/null 2>&1 && git diff --quiet -- data/tesouro.json; then
            echo "Sem mudanças nas taxas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tesouro.json
          git commit -m "Atualiza taxas do Tesouro Direto"
          git push
